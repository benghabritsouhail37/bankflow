name: BankFlow CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  # ============================================================
  # BACKEND / API TESTS
  # ============================================================

  backend-tests:

    name: Backend and API Tests

    runs-on: ubuntu-latest

    services:

      postgres:

        image: postgres:18

        env:
          POSTGRES_DB: bankflow_db
          POSTGRES_USER: bankflow_user
          POSTGRES_PASSWORD: bankflow_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U bankflow_user -d bankflow_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:

      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bankflow_db
      SPRING_DATASOURCE_USERNAME: bankflow_user
      SPRING_DATASOURCE_PASSWORD: bankflow_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Make Maven Wrapper executable
        run: chmod +x mvnw


      - name: Compile application
        run: ./mvnw clean compile


      - name: Run backend and API regression
        run: >
          ./mvnw
          -Dtest=UserServiceTest,UserControllerTest,UserIntegrationTest,UserApiRestAssuredTest,AccountServiceTest,AccountControllerTest,AccountIntegrationTest,AccountApiRestAssuredTest
          test


  # ============================================================
  # FRONTEND BUILD
  # ============================================================

  frontend-build:

    name: React Build

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Install frontend dependencies
        run: npm ci


      - name: Build React application
        run: npm run build


  # ============================================================
  # SELENIUM E2E
  # ============================================================

  selenium-tests:

    name: Selenium E2E Tests

    runs-on: ubuntu-latest

    needs:
      - backend-tests
      - frontend-build

    services:

      postgres:

        image: postgres:18

        env:
          POSTGRES_DB: bankflow_db
          POSTGRES_USER: bankflow_user
          POSTGRES_PASSWORD: bankflow_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U bankflow_user -d bankflow_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:

      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bankflow_db
      SPRING_DATASOURCE_USERNAME: bankflow_user
      SPRING_DATASOURCE_PASSWORD: bankflow_password

      SPRING_JPA_HIBERNATE_DDL_AUTO: update

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Java 21
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json


      - name: Make Maven Wrapper executable
        run: chmod +x mvnw


      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci


      - name: Check Chrome
        run: google-chrome --version


      # --------------------------------------------------------
      # START BACKEND
      # --------------------------------------------------------

      - name: Start Spring Boot backend
        run: |
          nohup ./mvnw spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid


      - name: Wait for backend
        run: |
          for i in {1..60}; do

            if curl --fail --silent http://localhost:8080/api/users > /dev/null; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2

          done

          echo "Backend failed to start"
          cat backend.log
          exit 1


      # --------------------------------------------------------
      # START FRONTEND
      # --------------------------------------------------------

      - name: Start React frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 > ../frontend.log 2>&1 &
          echo $! > ../frontend.pid


      - name: Wait for frontend
        run: |
          for i in {1..30}; do

            if curl --fail --silent http://localhost:5173 > /dev/null; then
              echo "Frontend is ready"
              exit 0
            fi

            echo "Waiting for frontend..."
            sleep 2

          done

          echo "Frontend failed to start"
          cat frontend.log
          exit 1


      # --------------------------------------------------------
      # RUN SELENIUM
      # --------------------------------------------------------

      - name: Run Selenium regression
        run: >
          xvfb-run --auto-servernum
          ./mvnw
          -Dtest=UserFormSeleniumTest,UserCreationSeleniumTest,UserValidationSeleniumTest,AccountDashboardSeleniumTest
          test


      # --------------------------------------------------------
      # DEBUG LOGS IF FAILURE
      # --------------------------------------------------------

      - name: Show backend logs on failure
        if: failure()
        run: |
          echo "===== BACKEND LOG ====="
          cat backend.log || true


      - name: Show frontend logs on failure
        if: failure()
        run: |
          echo "===== FRONTEND LOG ====="
          cat frontend.log || true